# EC528: CE config template with the mandatory vector namespace config.
# Rendered by entrypoint.sh via envsubst; ${...} placeholders only.

service {
	cluster-name ec528-vector
	proto-fd-max 1024
	work-directory /opt/aerospike
	${NODE_ID_LINE}
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		${MESH_SEED_LINES}
		interval 150
		timeout 10
	}

	fabric {
		address any
		port 3001
	}
}

namespace test {
	replication-factor ${REPLICATION_FACTOR}
	default-ttl 0

	vector-dimension ${VECTOR_DIM}
	vector-value-type ${VECTOR_TYPE}
	vector-metric ${VECTOR_METRIC}

	storage-engine memory {
		data-size 1073741824
	}
}
